
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Adventure — Игра</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="header">
        <a class="logo" href="index.html">✦ TINY ADVENTURE</a>
        <a href="index.html" class="back-link">← На главную</a>
    </header>

    <main id="gamePage">
        <h1>Твоё приключение</h1>

        <p class="controls">
            ← → или A D — движение · W, ↑ или Space — прыжок
        </p>

        <div id="gameArea">

            <div class="game-sky">
                <div class="sun"></div>
                <div class="cloud cloud-one"></div>
                <div class="cloud cloud-two"></div>
                <div class="cloud cloud-three"></div>
                <div class="mountain mountain-one"></div>
                <div class="mountain mountain-two"></div>

                <div class="sky-island island-left">
                    <div class="sky-grass"></div>
                </div>

                <div class="sky-island island-right">
                    <div class="sky-grass"></div>
                </div>

                <div class="sparkle sparkle-one">✦</div>
                <div class="sparkle sparkle-two">✧</div>
                <div class="sparkle sparkle-three">✦</div>
            </div>

            <div id="score">
                ⭐ Звёзды: <span id="scoreValue">0</span>
            </div>

            <div id="world">

                <div id="player">
                    <img src="boy.png" alt="Главный герой">
                </div>

                <div class="collectible-star" style="left: 350px; bottom: 160px;">⭐</div>
                <div class="collectible-star" style="left: 750px; bottom: 220px;">⭐</div>
                <div class="collectible-star" style="left: 1150px; bottom: 170px;">⭐</div>
                <div class="collectible-star" style="left: 1650px; bottom: 230px;">⭐</div>

                <div class="platform platform-one"></div>
                <div class="platform platform-two"></div>
                <div class="platform platform-three"></div>
                <div class="platform platform-four"></div>

                <div id="ground"></div>

            </div>
        </div>

        <button id="restartButton" type="button">
            Начать заново
        </button>
    </main>
</body>
</html>
