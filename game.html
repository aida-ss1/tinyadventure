
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Adventure - Игра</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <a class="logo" href="index.html">✦ TINY ADVENTURE</a>
        <a href="index.html" class="back-link">← На главную</a>
    </header>

    <main id="gamePage">
        <h1>Твоё приключение</h1>

        <p class="controls">
            Добро пожаловать в волшебный мир Tiny Adventure!
        </p>

        <div class="game-description">
            <h2>Маленькие герои. Большие приключения.</h2>
            <p>
                Tiny Adventure — это сказочный мир с необычными персонажами,
                парящими островами и удивительными приключениями.
            </p>
        </div>

        <div id="gameArea">

            <div class="game-sky">
                <div class="sun"></div>
                <div class="cloud cloud-one"></div>
                <div class="cloud cloud-two"></div>
                <div class="cloud cloud-three"></div>

                <div class="mountain mountain-one"></div>
                <div class="mountain mountain-two"></div>

                <div class="sky-island island-left">
                    <div class="sky-grass"></div>
                </div>

                <div class="sky-island island-right">
                    <div class="sky-grass"></div>
                </div>

                <div class="sparkle sparkle-one">✦</div>
                <div class="sparkle sparkle-two">✧</div>
                <div class="sparkle sparkle-three">✦</div>
            </div>

            <div id="world">

                <div id="player">
                    <img src="boy.png" alt="Главный герой">
                </div>

                <div class="collectible-star" style="left: 18%; bottom: 160px;">⭐</div>
                <div class="collectible-star" style="left: 40%; bottom: 220px;">⭐</div>
                <div class="collectible-star" style="left: 63%; bottom: 170px;">⭐</div>
                <div class="collectible-star" style="left: 84%; bottom: 230px;">⭐</div>

                <div class="platform platform-one"></div>
                <div class="platform platform-two"></div>
                <div class="platform platform-three"></div>
                <div class="platform platform-four"></div>

                <div id="ground"></div>

            </div>
        </div>
    </main>

    <footer>✦ Tiny Adventure · 2026 ✦</footer>
</body>
</html>
